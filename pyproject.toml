[project]
name = "dmpo"
version = "0.0.7"
description = "Maximum a Posteriori Policy Optimization and Related Algorithms"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'reinforcement learning',
    'mpo',
    'tpo'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "accelerate",
    "discrete-continuous-embed-readout",
    "einops>=0.8.1",
    "gymnasium[other]>=1.3.0",
    "memmap-replay-buffer>=0.1.4",
    "torch>=2.5",
    "torch-einops-utils>=0.1.2",
    "tqdm",
    "x-mlps-pytorch",
    "x-transformers",
]

[project.urls]
Homepage = "https://pypi.org/project/dmpo/"
Repository = "https://codeberg.org/lucidrains/dmpo"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "dmpo",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["dmpo"]
